#!extend aircraft/ara_a-4q.ini
// Merged into the A-4Q Skyhawk when the game reads it. The Air wing line's
// refit ranks give a Veinticinco de Mayo's own Skyhawks on Strike heavier
// loads in the air, one rung at a time (see DeckStores.cs). The first is the
// aircraft's own StrikeHeavy. These two follow it, and are left out of
// AvailableLoadouts, so the deck cannot hang them before the ranks are earned.
//
// Both carry what StrikeHeavy carries: three 1,000 lb bombs. The mod makes
// the bombs hit harder by the rung (DeckStores.Ladders): 1.5x at rank 15,
// and 2.5x over twice the blast radius at rank 20.

[WeaponSystem1SurvivorsStrike2]
SubModelsToHide=Outer_Pylons
ReadyUpTime=20
CoolDownTime=60
Station2=rn_mk13_1000lb|Mk83
Station3=rn_mk13_1000lb|Mk83
Station4=rn_mk13_1000lb|Mk83

[WeaponSystem1SurvivorsStrike3]
SubModelsToHide=Outer_Pylons
ReadyUpTime=20
CoolDownTime=60
Station2=rn_mk13_1000lb|Mk83
Station3=rn_mk13_1000lb|Mk83
Station4=rn_mk13_1000lb|Mk83
