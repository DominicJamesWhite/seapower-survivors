#!extend aircraft/wp_yak-38.ini
// Merged into the Yak-38 when the game reads it. The Air wing line's refit
// ranks give a Kiev's own anti-ship Yak-38s these loadouts in the air, one
// rung at a time (see DeckStores.cs). They are left out of AvailableLoadouts,
// so the deck cannot hang them before the ranks are earned.

// Rank 5: two S-25 rockets inboard of the two FAB-500s.
[WeaponSystem1SurvivorsAntiShip1]
ReadyUpTime=12
CoolDownTime=30
Station1=wp_s-25|S25
Station2=wp_fab-500|FAB500
Station3=wp_s-25|S25
Station4=wp_fab-500|FAB500

// Rank 15: four FAB-500s.
[WeaponSystem1SurvivorsAntiShip2]
ReadyUpTime=12
CoolDownTime=30
Station1=wp_fab-500|FAB500
Station2=wp_fab-500|FAB500
Station3=wp_fab-500|FAB500
Station4=wp_fab-500|FAB500

// Rank 20: four FAB-500s again, which the mod makes hit harder over a wider
// blast (DeckStores.HeavyDamage and HeavyBlast). A FAB-1500 cannot be
// dropped below 6,000 ft, and the AI never climbs a Yak that high to attack.
[WeaponSystem1SurvivorsAntiShip3]
ReadyUpTime=12
CoolDownTime=30
Station1=wp_fab-500|FAB500
Station2=wp_fab-500|FAB500
Station3=wp_fab-500|FAB500
Station4=wp_fab-500|FAB500
