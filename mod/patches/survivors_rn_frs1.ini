#!extend aircraft/rn_frs1.ini
// Merged into the Sea Harrier FRS.1 when the game reads it. The Air wing
// line's refit ranks give an Invincible's or Hermes's own Sea Harriers on
// Strike these loadouts in the air, one rung at a time (see DeckStores.cs).
// They are left out of AvailableLoadouts, so the deck cannot hang them before
// the ranks are earned.
//
// All three carry what Strike carries: three 1,000 lb bombs and two tanks,
// the only bomb load the aircraft's own file puts on these stations. The mod
// makes the bombs hit harder by the rung (DeckStores.Ladders): 1.4x at rank
// 5, twice at rank 15, and 3x over twice the blast radius at rank 20.

[WeaponSystem1SurvivorsStrike1]
SubModelsToHide=IRM_Rails
ReadyUpTime=15
CoolDownTime=60
Station1=rn_mk13_1000lb|MK83
Station2=rn_tank_230_frs|Fueltank
Station3=rn_mk13_1000lb|MK83
Station4=rn_tank_230_frs|Fueltank
Station5=rn_mk13_1000lb|MK83

