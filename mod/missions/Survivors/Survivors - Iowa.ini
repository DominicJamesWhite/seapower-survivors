; A Survivors run: one player ship in open water between Iceland and the
; Faroes. Because the file name begins "Survivors - ", the mod holds it
; paused until the player unpauses, then starts the run, and declares the
; victory itself; the only trigger here is losing the ship.

[Language_en]
Name=Survivors - Iowa
Description=Survive 20 minutes of game time against Soviet ships and aircraft in a single Iowa. Kills and missile intercepts earn XP; every level-up rearms the fleet and offers a choice of upgrades.
