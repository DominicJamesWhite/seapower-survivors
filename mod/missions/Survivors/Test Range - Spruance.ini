; A bare test range for the Survivors mod: one player ship in open water
; between Iceland and the Faroes, no enemies until the mod spawns them.
; There is deliberately no "enemy destroyed" victory trigger: with an empty
; enemy taskforce it would fire the moment the mission starts.

[Language_en]
Name=Test Range - Spruance
Description=One Spruance in open water and no enemies until you spawn them. Ctrl+F6 opens the test panel.
